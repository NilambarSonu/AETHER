name: AETHER macOS CI & Droplet Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'site/**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with packaged AETHER-Droplet.zip'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name (e.g. v2.0.0; defaults to v<droplet.json version>)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: aether-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package Droplet
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select Xcode 26+ SDK
        run: |
          echo "=== Available Xcode Installations ==="
          ls -d /Applications/Xcode*.app || true
          if compgen -G "/Applications/Xcode_2[6-9]*.app" > /dev/null; then
            LATEST_XCODE="$(ls -d /Applications/Xcode_2[6-9]*.app | sort -V | tail -1)"
            echo "Selecting Xcode 26+ SDK: $LATEST_XCODE..."
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          echo "=== Active Xcode Developer Directory ==="
          xcode-select -p
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2, a, "."); print a[1]}')"
          [ "${XCODE_MAJOR:-0}" -ge 26 ] || { echo "ERROR: Xcode 26+ is required on runner (found Xcode ${XCODE_MAJOR:-unknown})"; exit 1; }

      - name: Environment Diagnostics
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Swift Version ==="
          swift --version

      - name: Resolve Host Package Dependencies
        run: |
          swift package resolve

      - name: Build AetherCore Target
        run: |
          echo "==> Building AetherCore target..."
          swift build --target AetherCore

      - name: Run Complete Test Suite
        run: |
          echo "==> Running complete test suite (AetherCore, CodeCatchCore, CodeCatch)..."
          ./scripts/test.sh --force-resolved-versions

      - name: Verify All 704 OTP Fixture Cases
        run: |
          echo "==> Verifying all 704 OTP test fixtures..."
          swift test --filter CodeExtractorTests

      - name: Build Host Application (Release Configuration)
        run: |
          echo "==> Building host release binaries..."
          swift build -c release --scratch-path .build-release --force-resolved-versions \
            -Xswiftc -debug-prefix-map -Xswiftc "$PWD=/src" \
            -Xswiftc -file-prefix-map -Xswiftc "$PWD=/src"
          BIN_PATH="$(swift build -c release --scratch-path .build-release --show-bin-path)"
          echo "Release binaries located at: $BIN_PATH"
          ls -la "$BIN_PATH"

      - name: Checkout Pinned Official DroppyKit SDK (v1.23.0)
        run: |
          PINNED_SHA="11e4869898bf13991120e26af347b9007521623b"
          KIT_DIR="$RUNNER_TEMP/droppykit"
          rm -rf "$KIT_DIR"
          git clone https://gitlab.com/droppyformac1/droppykit.git "$KIT_DIR"
          git -C "$KIT_DIR" checkout --detach "$PINNED_SHA"
          ACTUAL_SHA="$(git -C "$KIT_DIR" rev-parse HEAD)"
          [ "$ACTUAL_SHA" = "$PINNED_SHA" ] || { echo "DroppyKit SHA mismatch: $ACTUAL_SHA"; exit 1; }
          echo "$KIT_DIR/Scripts" >> "$GITHUB_PATH"
          echo "DROPPYKIT_DIR=$KIT_DIR" >> "$GITHUB_ENV"
          "$KIT_DIR/Scripts/droppykit" version

      - name: Build & Validate AETHER.droplet with Official DroppyKit
        run: |
          echo "==> Verifying pinned Droplet Package.resolved matches official v1.23.0..."
          python3 - <<'PY'
          import json, pathlib
          pin_data = json.loads(pathlib.Path("Droplet/Package.resolved").read_text())
          pins = {p["identity"]: p for p in pin_data.get("pins", [])}
          dk = pins["droppykit"]
          assert dk["location"] == "https://gitlab.com/droppyformac1/droppykit.git", dk
          assert dk["state"]["version"] == "1.23.0", dk
          assert dk["state"]["revision"] == "11e4869898bf13991120e26af347b9007521623b", dk
          print("Droplet/Package.resolved verified:", dk["state"])
          PY

          echo "==> Running official droppykit version, lint, build, validate..."
          (
            cd Droplet
            droppykit version
            droppykit lint --no-binary --strict
            droppykit build
            droppykit validate
          )
          ./scripts/build-droplet.sh --validate-only

          echo "==> Confirming resolved SDK revision remained pinned after build..."
          python3 - <<'PY'
          import json, pathlib
          pin_data = json.loads(pathlib.Path("Droplet/Package.resolved").read_text())
          dk = next(p for p in pin_data["pins"] if p["identity"] == "droppykit")
          assert dk["state"]["revision"] == "11e4869898bf13991120e26af347b9007521623b", dk
          print("Post-build Droplet/Package.resolved still pinned to:", dk["state"]["revision"])
          PY

      - name: Run Official DroppyKit Harness Verification
        run: |
          (
            cd Droplet
            rm -rf shots
            droppykit run -- --shots ./shots --report ./shots/report.json
          )
          python3 - <<'PY'
          import json, pathlib
          report_path = pathlib.Path("Droplet/shots/report.json")
          assert report_path.is_file(), "Missing harness report.json"
          report = json.loads(report_path.read_text())
          print(json.dumps(report, indent=2))
          assert report.get("verdict") == "ok", f"Harness verdict not ok: {report.get('verdict')}"
          assert report.get("problems") == [], f"Harness reported problems: {report.get('problems')}"
          shots = report.get("shots") or []
          assert len(shots) >= 1, "No harness surface shots written"
          PY

      - name: Stage Clean Droplet Artifact Directory
        run: |
          rm -rf build-droplet-dist
          ./scripts/build-droplet.sh --stage-dist build-droplet-dist --bundle Droplet/.build/AETHER.droplet

          echo "==> Verifying extracted ZIP root layout (AETHER.droplet/ + README-TESTING.md ONLY)..."
          ls -la build-droplet-dist
          TMP_ZIP="$RUNNER_TEMP/verify-AETHER-Droplet.zip"
          rm -f "$TMP_ZIP"
          (cd build-droplet-dist && zip -qr "$TMP_ZIP" AETHER.droplet README-TESTING.md)
          python3 - "$TMP_ZIP" <<'PY'
          import pathlib, subprocess, sys

          dist_root = pathlib.Path("build-droplet-dist")
          disk_top_level = sorted(p.name for p in dist_root.iterdir())
          assert disk_top_level == ["AETHER.droplet", "README-TESTING.md"], f"Unexpected staged root entries: {disk_top_level}"
          hidden_entries = [str(p) for p in dist_root.rglob("*") if p.name.startswith(".")]
          assert not hidden_entries, f"Unexpected hidden entries in staged directory: {hidden_entries}"

          entries = subprocess.run(["unzip", "-Z1", sys.argv[1]], capture_output=True, text=True, check=True).stdout.splitlines()
          top_level = sorted({e.split("/")[0] for e in entries if e})
          assert top_level == ["AETHER.droplet", "README-TESTING.md"], f"Unexpected ZIP root entries: {top_level}"
          for required in (
              "AETHER.droplet/Contents/MacOS/AETHER",
              "AETHER.droplet/Contents/Info.plist",
              "AETHER.droplet/Contents/Resources/droplet.json",
              "README-TESTING.md",
          ):
              assert required in entries, f"Missing ZIP entry: {required}"
              assert (dist_root / required).stat().st_size > 0, f"Empty staged file: {required}"
          print("Verified clean ZIP layout; top-level entries:", top_level)
          PY
          rm -f "$TMP_ZIP"

      - name: Upload AETHER Droplet Bundle (Official Build)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AETHER-Droplet
          path: build-droplet-dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload DroppyKit Harness Report & Screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AETHER-Harness-Shots
          path: Droplet/shots
          if-no-files-found: error
          retention-days: 14

      - name: Upload Host Release Binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aether-host-binaries-macos15
          path: |
            .build-release/release/CodeCatch
            .build-release/release/CodeCatchCLI
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: macos-15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download Verified AETHER-Droplet Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-stage release-assets
          mkdir -p release-stage release-assets
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name AETHER-Droplet --dir release-stage
          ls -la release-stage

      - name: Package Release ZIP and Checksums
        env:
          EVENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          VERSION_FROM_MANIFEST="$(python3 -c 'import json; print(json.load(open("Droplet/droplet.json"))["version"])')"
          TAG="${EVENT_TAG:-v$VERSION_FROM_MANIFEST}"
          if [[ "$TAG" != v* ]]; then
            TAG="v$TAG"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

          (cd release-stage && zip -qr "$GITHUB_WORKSPACE/release-assets/AETHER-Droplet-${TAG}.zip" AETHER.droplet README-TESTING.md)
          cp "release-assets/AETHER-Droplet-${TAG}.zip" "release-assets/AETHER-Droplet.zip"
          (cd release-assets && shasum -a 256 "AETHER-Droplet-${TAG}.zip" "AETHER-Droplet.zip" > "AETHER-Droplet-${TAG}.sha256.txt")
          cat "release-assets/AETHER-Droplet-${TAG}.sha256.txt"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "AETHER Droplet ${RELEASE_TAG}" \
              --notes-file Droplet/CHANGELOG.md
          fi
